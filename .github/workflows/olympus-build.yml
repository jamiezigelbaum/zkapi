name: olympus-build
on:
  push:
    branches: ['olympus/**']
    tags: ['olympus-*', 'v*-olympus*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: zkapi-clientd}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true, cache-dependency-path: zkapi-clientd/go.sum}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  build:
    needs: test
    runs-on: macos-latest   # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: false}
      - run: uname -m
      - name: Reproducible build (fails if two builds differ)
        run: bash zkapi-clientd/olympus/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zkapi-clientd-darwin-arm64
          path: |
            zkapi-clientd/olympus/dist/zkapi-clientd
            zkapi-clientd/olympus/dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: zkapi-clientd/olympus/dist/third-party
  linux-confine:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: zkapi-clientd}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true, cache-dependency-path: zkapi-clientd/go.sum}
      - name: Check launcher formatting
        run: test -z "$(gofmt -l ./cmd/zkapi-confine)"
      - name: Vet release launcher
        run: go vet -tags= ./cmd/zkapi-confine
      - name: Race-test release launcher
        run: go test -race -tags= ./cmd/zkapi-confine
      - name: Vet and test qualification tag sets
        shell: bash
        run: |
          set -euo pipefail
          for tags in qualification qualification,qualification_adversary; do
            go vet -tags="$tags" ./cmd/zkapi-confine
            go test -race -tags="$tags" ./cmd/zkapi-confine
          done
      - name: Compile qualification fixtures (CI only)
        run: bash cmd/zkapi-confine/qualification/build.sh "$RUNNER_TEMP/confine-fixtures"
      - name: Reproducible Linux build (fails if either binary differs)
        run: bash olympus/build.sh linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: zkapi-clientd-linux-amd64
          path: |
            zkapi-clientd/olympus/dist/zkapi-clientd
            zkapi-clientd/olympus/dist/bin/zkapi-confine
            zkapi-clientd/olympus/dist/SHA256SUMS
            zkapi-clientd/olympus/dist/reproducibility.json
          if-no-files-found: error
