name: olympus-build
on:
  push:
    branches: ['olympus/**']
    tags: ['olympus-*', 'v*-olympus*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: zkapi-clientd}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true, cache-dependency-path: zkapi-clientd/go.sum}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  build:
    needs: test
    runs-on: macos-latest   # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: false}
      - run: uname -m
      - name: Reproducible build (fails if two builds differ)
        run: bash zkapi-clientd/olympus/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zkapi-clientd-darwin-arm64
          path: |
            zkapi-clientd/olympus/dist/zkapi-clientd
            zkapi-clientd/olympus/dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: zkapi-clientd/olympus/dist/third-party
